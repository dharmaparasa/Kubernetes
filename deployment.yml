apiVersion : apps/v1
kind : Deployment
metadata : 
  name : python-deployment
spec  : 
  replicas : 2

  selector: 
    matchLabels: 
      app : python
  
  template:
    metadata:
      name: python-pod
      labels:
        app : python
    
    spec: 
      containers: 
        - name: python-container
          image: httpd:latest
          ports:
            - containerPort: 80


